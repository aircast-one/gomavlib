name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        go: ["1.25", "1.26"]

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - run: make test-nodocker

    - if: matrix.go == '1.26'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
